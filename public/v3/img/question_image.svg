<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 663" width="450" height="663" role="img" aria-label="Вопросы Skoda Family">
  <defs>
    <linearGradient id="qGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#9CFFC8"/>
      <stop offset="38%" stop-color="#4FD98A"/>
      <stop offset="72%" stop-color="#229A5E"/>
      <stop offset="100%" stop-color="#0E3A30"/>
    </linearGradient>
    <linearGradient id="qShine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <!-- объёмная подложка со смещением -->
    <g stroke="#0B2A22" opacity="0.35" transform="translate(9,11)">
      <path d="M 108 196 A 122 122 0 1 1 225 338 L 225 432" stroke-width="86"/>
      <circle cx="225" cy="566" r="47" stroke="none" fill="#0B2A22"/>
    </g>

    <!-- основная форма -->
    <g stroke="url(#qGrad)">
      <path d="M 108 196 A 122 122 0 1 1 225 338 L 225 432" stroke-width="86"/>
    </g>
    <circle cx="225" cy="566" r="47" fill="url(#qGrad)" stroke="none"/>

    <!-- блик -->
    <g stroke="url(#qShine)">
      <path d="M 108 196 A 122 122 0 1 1 225 338 L 225 432" stroke-width="26" transform="translate(-16,-18)"/>
    </g>
  </g>
</svg>
